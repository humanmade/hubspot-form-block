name: Release

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: chekcreative/wp-release-action@v1.1.0
        with:
          slug: chek-hubspot-form-block
          product-name: Chek Hubspot Form Block
          releases-url: https://releases.chek.co
          build-command: npm ci && npm run build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          requires-wp: '6.1'
          requires-php: '7.0'
          tested-up-to: '6.9'
          extra-excludes: |
            src/*
            vendor/*
            artifacts/*
            playwright-report/*
            test-results/*
            .claude/*
            AGENTS.md
            README.md
            blueprint.json
            playwright.config.js
