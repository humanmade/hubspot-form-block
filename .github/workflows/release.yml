name: Version and Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version number to release (e.g. 1.2.3, without a leading "v")'
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm i

            - name: Update version in plugin file
              run: sed -i "s/__VERSION__/${{ inputs.version }}/g" hubspot-form-block.php

            - name: Build
              run: npm run build

            - name: Create tag
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "Update version to ${{ inputs.version }}"
                  git tag "v${{ inputs.version }}"
                  git push origin "v${{ inputs.version }}"

            - name: Create plugin ZIP
              run: npm run plugin-zip

            - name: Create GitHub Release
              run: |
                  gh release create "v${{ inputs.version }}" hubspot-form-block.zip \
                    --title "v${{ inputs.version }}" \
                    --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
